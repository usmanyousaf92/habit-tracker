name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Android package
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # Best effort: pulls the Quicksand/Nunito woff2 files and inlines them as
      # data URIs so the app's typography survives with no network. If Google
      # Fonts is unreachable the build carries on with the CDN <link> intact.
      - name: Inline webfonts for offline use
        continue-on-error: true
        run: python3 tools/inline_fonts.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Detect release signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "No KEYSTORE_BASE64 secret set — building the debug APK only."
          fi

      - name: Build debug APK
        run: >
          gradle :app:assembleDebug
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}
          --no-daemon --stacktrace

      - name: Decode release keystore
        if: steps.signing.outputs.enabled == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK and AAB
        if: steps.signing.outputs.enabled == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          gradle :app:assembleRelease :app:bundleRelease
          -PversionCode=${{ github.run_number }}
          -PversionName=1.0.${{ github.run_number }}
          --no-daemon --stacktrace

      - name: Summarise outputs
        run: |
          {
            echo "### Build outputs"
            echo ""
            echo '| File | Size |'
            echo '| --- | --- |'
            find app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) \
              -printf '| `%f` | %s bytes |\n' | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Play Store bundle
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: habit-tracker-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30
